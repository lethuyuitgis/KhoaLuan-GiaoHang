<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh toán thành công</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #34c759 0%, #1e8a3a 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            background: #fff;
            color: #1a1a1a;
            border-radius: 16px;
            padding: 2rem 1.5rem;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.15);
        }
        .icon {
            width: 64px;
            height: 64px;
            background: #34c759;
            color: #fff;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 1rem;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .subtitle { color: #6e6e73; margin-bottom: 1.5rem; }
        .row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-top: 1px solid #f0f0f0;
        }
        .row:first-of-type { border-top: 0; }
        .label { color: #6e6e73; }
        .value { font-weight: 600; }
        .button {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.875rem 1.5rem;
            background: #007aff;
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            text-align: center;
        }
        .button.secondary {
            background: transparent;
            color: #007aff;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">&check;</div>
        <h1>Thanh toán thành công</h1>
        <p class="subtitle">Đơn hàng của bạn đã được xác nhận</p>
        <div class="row">
            <span class="label">Mã đơn</span>
            <span class="value" id="orderCode">—</span>
        </div>
        <div class="row">
            <span class="label">Số tiền</span>
            <span class="value" id="amount">—</span>
        </div>
        <a href="javascript:void(0)" class="button" onclick="window.close()">Đóng</a>
        <a href="javascript:void(0)" class="button secondary" onclick="history.back()">Quay lại</a>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('orderCode') || '—';
        const amount = params.get('amount');
        document.getElementById('orderCode').textContent = code;
        if (amount && !Number.isNaN(Number(amount))) {
            document.getElementById('amount').textContent =
                Number(amount).toLocaleString('vi-VN') + ' đ';
        }
    </script>
</body>
</html>
