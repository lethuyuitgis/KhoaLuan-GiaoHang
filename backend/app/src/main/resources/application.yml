spring:
  application:
    name: delivery-app
  profiles:
    default: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: 0.1.0-SNAPSHOT

bot:
  # token + username MUST be set via env vars or profile-specific config
  mode: polling

shop:
  pickup:
    lat: 21.0285
    lng: 105.8542
    address: "Shop default"
  fee:
    base: 15000
    per-km: 5000
    free-km: 0

vnpay:
  tmn-code:        ${VNPAY_TMN_CODE:TEST01}
  hash-secret:     ${VNPAY_HASH_SECRET:TESTSECRETKEY123}
  pay-url:         https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url:      ${VNPAY_RETURN_URL:http://localhost:8080/api/payment/vnpay/return}
  ipn-url:         ${VNPAY_IPN_URL:http://localhost:8080/api/payment/vnpay/ipn}
  timeout-minutes: 15

zalo:
  # Zalo Mini App auth (frontend/zaloapp). app-id is public (embedded in the
  # shipped Mini App); app-secret is SECRET — set via env, never commit.
  # ZaloAuthFilter self-disables when app-id is blank.
  app-id:      ${ZALO_APP_ID:2561890966422977519}
  app-secret:  ${ZALO_APP_SECRET:}
  mini-app-id: ${ZALO_MINI_APP_ID:}

jwt:
  access-ttl: PT15M
  refresh-ttl: P7D
