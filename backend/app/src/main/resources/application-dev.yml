spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/shop_delivery
    username: app
    password: app_dev_password
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.shop.delivery: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

management:
  endpoint:
    health:
      show-details: always

bot:
  token: ${BOT_TOKEN:dev-token-not-set}
  username: ${BOT_USERNAME:DevBot}
  mode: polling

shop:
  pickup:
    lat: 21.0285        # Hoàn Kiếm, HN
    lng: 105.8542
    address: "123 Lê Lợi, Hoàn Kiếm, HN"
  fee:
    base: 15000
    per-km: 5000
    free-km: 1.0
